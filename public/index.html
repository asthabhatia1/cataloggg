<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#202c33" />
  <title>Catalog</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
      <div class="topbar-left">
        <button class="icon-btn hidden" id="backBtn" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1 id="pageTitle">Catalog</h1>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="cartBtn" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          <span class="cart-count" id="cartCount">0</span>
        </button>
        <button class="icon-btn" id="shareBtn" aria-label="Share">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9M15.4 6.6l-6.8 3.9"/></svg>
        </button>
      </div>
      </div>
    </header>
    <main class="wrap" id="app"></main>
  </div>
  <div class="toast" id="toast"></div>
  <div id="cartSheetRoot" class="sheet-root" aria-hidden="true">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12.5l5 5 9-10"/></svg>
      </div>
      <h2 id="sheetTitle">Added to cart</h2>
      <p class="sheet-sub" id="sheetSub">This item is in your cart.</p>
      <div class="sheet-item">
        <img id="sheetImg" alt="" />
        <div>
          <strong id="sheetName"></strong>
          <div class="muted" id="sheetMeta"></div>
        </div>
      </div>
      <button class="sheet-primary" type="button" id="sheetViewCart">View cart</button>
      <button class="sheet-secondary" type="button" id="sheetContinue">Continue shopping</button>
    </div>
  </div>
  <script src="/js/app.js"></script>
</body>
</html>
